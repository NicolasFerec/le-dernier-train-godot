name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  package:
    if: github.event_name == 'push' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fsSL --retry 3 "$url/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot.zip
          curl -fsSL --retry 3 "$url/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          curl -fsSL --retry 3 "$url/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          sed -n 's/  *Godot_v4.7.2-stable_linux.x86_64.zip$/  godot.zip/p; s/  *Godot_v4.7.2-stable_export_templates.tpz$/  templates.tpz/p' SHA512-SUMS.txt | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/bin" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          install "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/bin/godot"
          unzip -jq templates.tpz 'templates/linux_release.x86_64' 'templates/windows_release_x86_64.exe' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          mv godot.zip templates.tpz SHA512-SUMS.txt "$RUNNER_TEMP/"
      - name: Install GodotSteam
        run: |
          curl -fsSL --retry 3 https://codeberg.org/godotsteam/godotsteam/releases/download/v4.24-gde/godotsteam-4.24-gdextension-plugin-4.4.zip -o "$RUNNER_TEMP/steam.zip"
          echo "d4358888959a03f4df0c71aafbcdca8f34b8cb9d4522aa5c8454f0e9e3debbf7  $RUNNER_TEMP/steam.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/steam.zip" 'addons/godotsteam/godotsteam.gdextension' 'addons/godotsteam/license.md' 'addons/godotsteam/linux64/*' 'addons/godotsteam/win64/*'
      - name: Package Windows and Linux
        run: |
          set -euo pipefail
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            version="0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            sed -i "s/^config\/version=.*/config\/version=\"$version\"/" project.godot
            scripts/package-release.sh "v$version" "$RUNNER_TEMP/release" dev
          else
            scripts/package-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
          fi
      - name: Publish stable release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 \
            --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')
          notes_from=()
          if [[ -n "$previous" ]]; then
            notes_from=(--notes-start-tag "$previous")
          fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* --verify-tag --generate-notes "${notes_from[@]}" --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Update rolling Dev prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A rerun of an older merge must not replace the current Dev build.
          if [[ $(git ls-remote origin refs/heads/main | cut -f1) != "$GITHUB_SHA" ]]; then
            exit 0
          fi
          cd "$RUNNER_TEMP/release"
          version=$(jq -r .version update.json)
          notes="Build $version from $GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" push --force origin "$GITHUB_SHA:refs/tags/dev"
          if ! gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create dev --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "Le Dernier Train Dev" --notes "$notes"
          fi
          gh release upload dev Le-Dernier-Train-* --repo "$GITHUB_REPOSITORY" --clobber
          # Switch the manifest after both platform packages are available.
          gh release upload dev update.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit dev --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false --notes "$notes"
          # Keep the previous archives for launchers already using the old manifest.
          assets=$(gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for platform in linux windows; do
            printf '%s\n' "$assets" | sed -n "/^Le-Dernier-Train-$platform-x86_64-.*\.zip$/p" | sort -V | head -n -2 |
              while IFS= read -r asset; do
                gh release delete-asset dev "$asset" --repo "$GITHUB_REPOSITORY" --yes
              done
          done
